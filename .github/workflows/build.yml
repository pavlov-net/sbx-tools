name: Build kits

# Pull requests build the kits without pushing; main pushes and signs them.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  KIT_REGISTRY: ghcr.io/${{ github.repository }}
  PUSH: ${{ github.event_name != 'pull_request' }}

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing via GitHub OIDC

jobs:
  kits:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kit: [sfw, tools, rust, python, bun, cxx, ssh-agent-proxy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: env.PUSH == 'true'

      # The descriptor's `# syntax=docker/sandbox-kit:3` line selects the kit
      # frontend; it finds the companion <kit>.dockerfile by stem.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mixins/${{ matrix.kit }}
          file: mixins/${{ matrix.kit }}/${{ matrix.kit }}.yaml
          push: ${{ env.PUSH == 'true' }}
          # PRs read the cache that main writes.
          cache-from: type=gha,scope=${{ matrix.kit }}
          cache-to: ${{ env.PUSH == 'true' && format('type=gha,mode=max,scope={0}', matrix.kit) || '' }}
          tags: |
            ${{ env.KIT_REGISTRY }}/${{ matrix.kit }}:latest
            ${{ env.KIT_REGISTRY }}/${{ matrix.kit }}:sha-${{ github.sha }}

      - name: Sign
        if: env.PUSH == 'true'
        run: cosign sign --yes "${{ env.KIT_REGISTRY }}/${{ matrix.kit }}@${{ steps.build.outputs.digest }}"
