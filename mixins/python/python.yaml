# syntax=docker/sandbox-kit:3
# Python extras. The workload already has Python, pip and uv, and the sfw mixin
# wraps them. Content recipe: python.dockerfile.
schemaVersion: "3"
displayName: sbx-tools python
description: >-
  The pyright language server and network access to PyPI. Use uv for packages,
  virtual environments and other Python versions, not `python -m pip`.
sourceUrl: https://github.com/pavlov-net/sbx-tools
licenses: [MIT]

kind: mixin
version: "0.1.0"

# Pyright runs on the node from the tools mixin.
requires: ["node", "deb/uv"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - pypi.org:443
          - files.pythonhosted.org:443

  # Offered as both versions; the runtime selects the one the workload uses.
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config: &agent-context
      content: |
        ## Python

        Python 3.14 with `uv`. Use `uv` for virtual environments, installs and scripts, and `uv python install` or `uv run --python` for other Python versions. Don't use `python -m pip` or `python -m venv`: their installs skip Socket Firewall. Language server: `pyright-langserver`; type check with `pyright`.

  - type: com.docker.sandbox/agent-context@2
    optional: true
    config: *agent-context
