# syntax=docker/sandbox-kit:3
# C/C++ toolchain for crates that build native code (cc, cmake, bindgen,
# openssl-sys). Declaration-only: an install hook apt-installs from the
# workload's own DHI and Debian repos, so dpkg's database stays consistent (a
# mixin shipping .debs would replace the workload's dpkg status file).
# About 20s and 700MB per sandbox; `sbx-up create --no-cxx` skips it.
schemaVersion: "3"
displayName: C/C++ toolchain
description: >-
  g++, clang/libclang, cmake, pkg-config and libssl-dev from the DHI and
  Debian 13 repos, installed when the sandbox is created.
sourceUrl: https://github.com/pavlov-net/sbx-tools
licenses: [MIT]

kind: mixin
version: "0.1.0"

args:
  extraPackages:
    default: ""
    pattern: '^[a-z0-9.+ -]*$'
    description: More apt packages to install, space-separated (e.g. "libsqlite3-dev protobuf-compiler")
    env: CXX_EXTRA_PACKAGES

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      # Only while install hooks run; closed before the agent starts.
      install:
        allow:
          - dhi.io:443
          - deb.debian.org:443
          - deb.debian.org:80
          - snapshot.debian.org:443
          - snapshot.debian.org:80

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - description: Install the C/C++ toolchain
          user: "0"
          env: [CXX_EXTRA_PACKAGES]
          command: |
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              g++ clang libclang-dev cmake pkg-config libssl-dev $CXX_EXTRA_PACKAGES
            apt-get clean
            rm -rf /var/lib/apt/lists/*

  # Offered as both versions; the runtime selects the one the workload uses.
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config: &agent-context
      content: |
        ## C/C++ toolchain

        `g++` (default `c++`), `clang`/`clang++` 19 with libclang for bindgen,
        `cmake`, `pkg-config` and OpenSSL headers. More apt packages need a new
        sandbox created with `--kit-arg extraPackages="…"`; the install-time
        network allow is closed once the agent starts.

  - type: com.docker.sandbox/agent-context@2
    optional: true
    config: *agent-context
